<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="google-site-verification" content="-aD-0vIASkKVZJzZDf4IiZR7sfMg5eK6QkLgDKY8YVI" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليل الصور والتصاميم مجاناً | DesignFlow Pro</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --gold: #f59e0b; --text: #f8fafc; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 850px; width: 100%; background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .upload-box { border: 2px dashed var(--accent); padding: 40px; text-align: center; border-radius: 12px; cursor: pointer; margin: 20px 0; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-gold { background: var(--gold); color: #000; }
        .results { display: none; margin-top: 20px; border-top: 1px solid #475569; padding-top: 20px; }
        .pro-locked { filter: blur(4px); pointer-events: none; }
        .promo-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .promo-input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: var(--bg); color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>DesignFlow - تحليل التصاميم</h1>
    <div class="promo-box" id="promoBox">
        <input type="text" id="promoCodeInput" class="promo-input" placeholder="كود التفعيل (PRO2026)">
        <button class="btn btn-gold" style="width: auto;" onclick="activateCode()">تفعيل</button>
    </div>
    <div id="counterBadge" style="text-align: center; color: var(--gold); margin-bottom: 10px;">
        المحاولات المتبقية: <span id="remAnalyses">3</span>
    </div>
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p>اضغط لرفع الصورة</p>
        <input type="file" id="fileInput" accept="image/*">
        <img id="preview" style="max-width:100px; display:none;">
    </div>
    <button id="analyzeBtn" class="btn" disabled onclick="analyzeImage()">تحليل الصورة</button>
    <div id="results" class="results">
        <h3 id="scoreVal">--</h3>
        <ul id="recommendationsList"></ul>
        <div id="proLockBanner" style="color:var(--gold);">🔒 اشترك في PRO للتقرير الكامل.</div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const MAX_FREE = 3;
    const VALID_CODE = "PRO2026";

    // تحميل الحالة من الذاكرة
    let usageCount = parseInt(localStorage.getItem("d_usage") || "0");
    let isPro = localStorage.getItem("d_pro") === "true";

    function updateUI() {
        if (isPro) {
            document.getElementById('promoBox').innerHTML = "✨ حسابك مفعل (PRO)";
            document.getElementById('counterBadge').style.display = 'none';
            document.getElementById('proLockBanner').style.display = 'none';
        } else {
            document.getElementById('remAnalyses').innerText = Math.max(0, MAX_FREE - usageCount);
        }
    }

    function activateCode() {
        if(document.getElementById('promoCodeInput').value.trim() === VALID_CODE) {
            localStorage.setItem("d_pro", "true");
            isPro = true;
            updateUI();
            alert("تم التفعيل!");
        } else {
            alert("كود خاطئ");
        }
    }

    fileInput.addEventListener('change', (e) => {
        if(e.target.files[0]) {
            document.getElementById('preview').style.display = 'block';
            document.getElementById('preview').src = URL.createObjectURL(e.target.files[0]);
            analyzeBtn.disabled = false;
        }
    });

    function analyzeImage() {
        if (!isPro && usageCount >= MAX_FREE) {
            alert("انتهت المحاولات!");
            return;
        }
        if (!isPro) {
            usageCount++;
            localStorage.setItem("d_usage", usageCount);
            updateUI();
        }
        
        // كود التحليل
        document.getElementById('results').style.display = 'block';
        document.getElementById('scoreVal').innerText = "تم التحليل بنجاح!";
        if(!isPro) document.getElementById('recommendationsList').classList.add('pro-locked');
    }

    updateUI();
</script>
</body>
</html>
