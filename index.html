<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesignFlow AI - أداة تحليل التصميم الحقيقية</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --subtext: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: var(--accent); margin-bottom: 20px; }
        .upload-box {
            border: 2px dashed var(--accent);
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 20px;
            background: rgba(59, 130, 246, 0.05);
        }
        input[type="file"] { display: none; }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
        }
        .btn:disabled { background: var(--subtext); cursor: not-allowed; }
        .preview-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        .results { display: none; margin-top: 30px; border-top: 1px solid var(--subtext); padding-top: 20px; }
        .score-card {
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .score-val { font-size: 48px; font-weight: bold; color: #10b981; }
        .palette { display: flex; gap: 10px; margin: 15px 0; }
        .color-swatch { flex: 1; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; text-shadow: 0 1px 2px #000; }
        .metric { margin: 10px 0; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h1>DesignFlow - تحليل التصميم الفعلي</h1>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p>اضغط هنا لرفع صورة التصميم</p>
        <input type="file" id="fileInput" accept="image/*">
        <img id="preview" class="preview-img">
    </div>

    <button id="analyzeBtn" class="btn" disabled onclick="analyzeImage()">تحليل التصميم الآن 🚀</button>

    <div id="results" class="results">
        <div class="score-card">
            <h3>التقييم الإجمالي الفعلي</h3>
            <div class="score-val" id="scoreVal">--</div>
        </div>

        <div class="metric">
            <strong>الأبعاد والنسبة:</strong> <span id="dimensionsVal">--</span>
        </div>

        <div class="metric">
            <strong>مستوى السطوع (Brightness):</strong> <span id="brightnessVal">--</span>
        </div>

        <div class="metric">
            <strong>مستوى التباين (Contrast):</strong> <span id="contrastVal">--</span>
        </div>

        <h4>الألوان المهيمنة المستخرجة:</h4>
        <div class="palette" id="paletteBox"></div>

        <h4>التوصيات والتقرير الحقيقي:</h4>
        <ul id="recommendationsList"></ul>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const results = document.getElementById('results');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let loadedImage = null;

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                preview.src = event.target.result;
                preview.style.display = 'block';
                
                loadedImage = new Image();
                loadedImage.onload = () => {
                    analyzeBtn.disabled = false;
                };
                loadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    function analyzeImage() {
        if (!loadedImage) return;

        canvas.width = loadedImage.width;
        canvas.height = loadedImage.height;
        ctx.drawImage(loadedImage, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        // 1. حساب السطوع والتباين الفعليين
        let totalBrightness = 0;
        let rgbValues = [];

        for (let i = 0; i < data.length; i += 16) { // أخذ عينات للأداء
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            // معادلة السطوع الإدراكي
            const brightness = (0.299 * r + 0.587 * g + 0.114 * b);
            totalBrightness += brightness;
            rgbValues.push({r, g, b, brightness});
        }

        const sampleCount = rgbValues.length;
        const avgBrightness = Math.round(totalBrightness / sampleCount);

        // حساب التباين (Standard Deviation للسطوع)
        let varianceSum = 0;
        rgbValues.forEach(p => {
            varianceSum += Math.pow(p.brightness - avgBrightness, 2);
        });
        const contrast = Math.round(Math.sqrt(varianceSum / sampleCount));

        // 2. استخراج الألوان الأساسية
        const palette = extractPalette(rgbValues);

        // 3. حساب الـ Score الحقيقي
        let score = 100;
        const recs = [];

        if (avgBrightness < 80) {
            score -= 15;
            recs.push("التصميم معتم جدًا (Dark)، قد يحتاج لزيادة الإضاءة أو تباين العناصر.");
        } else if (avgBrightness > 220) {
            score -= 10;
            recs.push("التصميم فاتح جدًا، تأكد من وضوح النصوص الشفافة.");
        } else {
            recs.push("مستوى السطوع متوازن ومناسب للعين.");
        }

        if (contrast < 40) {
            score -= 20;
            recs.push("التباين ضعيف جدًا! العناصر والنصوص قد تكون غير واضحة للجمهور.");
        } else {
            recs.push("مستوى التباين جيد ويساعد على إبراز التفاصيل.");
        }

        if (loadedImage.width < 800 || loadedImage.height < 800) {
            score -= 10;
            recs.push("أبعاد الصورة صغيرة نسبيًا، يفضل رفع دقة التصميم لتجنب الضبابية.");
        } else {
            recs.push("أبعاد ودقة التصميم ممتازة للنشر.");
        }

        // عرض النتائج
        document.getElementById('scoreVal').innerText = `${score} / 100`;
        document.getElementById('dimensionsVal').innerText = `${loadedImage.width}x${loadedImage.height} px`;
        document.getElementById('brightnessVal').innerText = `${avgBrightness} / 255`;
        document.getElementById('contrastVal').innerText = `${contrast}`;

        // عرض الألوان
        const paletteBox = document.getElementById('paletteBox');
        paletteBox.innerHTML = '';
        palette.forEach(color => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = color;
            swatch.innerText = color;
            paletteBox.appendChild(swatch);
        });

        // عرض التوصيات
        const recList = document.getElementById('recommendationsList');
        recList.innerHTML = '';
        recs.forEach(r => {
            const li = document.createElement('li');
            li.innerText = r;
            recList.appendChild(li);
        });

        results.style.display = 'block';
    }

    function extractPalette(samples) {
        // خوارزمية مبسطة لاختيار 4 ألوان مميزة
        const colors = [];
        const step = Math.floor(samples.length / 4);
        for (let i = 0; i < 4; i++) {
            const p = samples[i * step];
            if (p) {
                const hex = "#" + ((1 << 24) + (p.r << 16) + (p.g << 8) + p.b).toString(16).slice(1);
                colors.push(hex);
            }
        }
        return colors;
    }
</script>

</body>
</html>
